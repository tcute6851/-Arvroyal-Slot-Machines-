<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0605" />
<title>🎡 ArvRoyal Spin — Wheel of Fortune</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --gold:#ffd700;
  --gold-lt:#ffe98a;
  --gold-dp:#8a6512;
  --green:#4eff8a;
  --red:#ff4757;
  --orange:#ffa502;
  --text:#f6efe3;
  --radius:26px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse 90% 55% at 50% -8%, #3d1c12 0%, transparent 62%),
    radial-gradient(ellipse 80% 50% at 50% 115%, #2c120b 0%, transparent 62%),
    #070303;
  min-height:100vh;
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:10px;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;touch-action:manipulation;}

/* ── CABINET ── */
.cabinet{
  position:relative;width:100%;max-width:540px;
  display:flex;flex-direction:column;gap:12px;
  padding:14px;border-radius:var(--radius);
  border:1px solid rgba(255,215,0,.16);
  background:
    linear-gradient(180deg, rgba(255,215,0,.05), rgba(0,0,0,.35) 42%),
    linear-gradient(165deg,#2f1a11 0%,#170c07 46%,#22110b 100%);
  box-shadow:
    0 26px 70px rgba(0,0,0,.88),
    0 0 0 1px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,230,150,.10),
    inset 0 0 80px rgba(255,170,0,.045);
}
.corner-gem{
  position:absolute;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%, #fff6c4, #ffd700 40%, #8a6512);
  box-shadow:0 0 14px rgba(255,215,0,.55);
  pointer-events:none;z-index:6;
}
.corner-gem.tl{top:8px;left:8px}   .corner-gem.tr{top:8px;right:8px}
.corner-gem.bl{bottom:8px;left:8px} .corner-gem.br{bottom:8px;right:8px}

/* ── HEADER ── */
.cabinet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:8px;min-width:0;}
.brand-crown{font-size:1.4rem;line-height:1;color:var(--gold);filter:drop-shadow(0 0 10px rgba(255,215,0,.55));}
.brand-title{
  display:block;font-family:'Playfair Display',serif;font-weight:900;
  font-size:1.02rem;letter-spacing:.3px;line-height:1.1;
  background:linear-gradient(180deg,#fff6cf,#ffd700 48%,#b8860b);
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;
}
.brand-sub{display:block;font-size:.5rem;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,215,0,.38);margin-top:1px;}
.stats{display:flex;align-items:center;gap:7px;margin-left:auto;}
.stat{
  min-width:74px;padding:5px 9px;border-radius:13px;text-align:right;
  background:linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,.32));
  border:1px solid rgba(255,215,0,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.stat .label{display:block;font-size:.48rem;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:rgba(255,215,0,.45);}
.stat .value{font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;letter-spacing:.2px;white-space:nowrap;}
.stat .value .cur{color:var(--gold);font-size:.72rem;margin-right:1px;}
.stat .value.win{color:var(--green);}
.stat .value.win .cur{color:var(--green);}
.icon-btn{
  width:34px;height:34px;flex:0 0 34px;border-radius:50%;
  display:grid;place-items:center;font-size:.95rem;cursor:pointer;
  color:var(--gold);
  background:linear-gradient(180deg, rgba(255,215,0,.14), rgba(255,215,0,.03));
  border:1px solid rgba(255,215,0,.16);transition:.2s;
}
.icon-btn:hover{background:rgba(255,215,0,.2);}
.icon-btn:active{transform:scale(.92);}

/* ── WHEEL STAGE ── */
.stage{position:relative;display:flex;justify-content:center;padding:6px 0 2px;}
.wheel-stage{
  position:relative;width:100%;max-width:440px;aspect-ratio:1/1;
}
.wheel-stage::before{
  content:'';position:absolute;inset:-12px;border-radius:50%;
  background:conic-gradient(from 0deg,
     rgba(255,200,60,.30), rgba(255,200,60,0) 22%,
     rgba(255,200,60,.30) 47%, rgba(255,200,60,0) 72%,
     rgba(255,200,60,.30));
  filter:blur(14px);opacity:.55;
  animation:spinGlow 8s linear infinite;pointer-events:none;
}
@keyframes spinGlow{to{transform:rotate(360deg)}}
#wheelCanvas{
  position:relative;width:100%;height:100%;display:block;
  border-radius:50%;cursor:pointer;touch-action:manipulation;
  filter:drop-shadow(0 16px 30px rgba(0,0,0,.8));
}

/* ── POINTER ── */
.pointer{
  position:absolute;top:-4%;left:50%;width:10%;aspect-ratio:1/1.4;
  z-index:8;pointer-events:none;
  transform-origin:50% 12%;
  transform:translateX(-50%) rotate(0deg);
  filter:drop-shadow(0 5px 9px rgba(0,0,0,.75));
}
.pointer::after{
  content:'';display:block;width:100%;height:100%;
  background:linear-gradient(160deg,#fff9db 0%,#ffd700 26%,#c9971b 58%,#7d5a10 100%);
  clip-path:polygon(50% 100%, 3% 44%, 21% 0%, 79% 0%, 97% 44%);
}
.pointer::before{
  content:'';position:absolute;top:-2%;left:50%;transform:translateX(-50%);
  width:54%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff8d0, #e8c45c 45%, #7d5a10);
  box-shadow:0 0 14px rgba(255,215,0,.55);z-index:2;
}

/* ── FX LAYER ── */
.fx{
  position:absolute;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;overflow:hidden;border-radius:50%;
}
.win-popup{
  opacity:0;transform:scale(.4);
  font-family:'Playfair Display',serif;font-weight:900;
  font-size:clamp(1.5rem,7vw,2.3rem);
  color:#ffd700;text-align:center;line-height:1.1;
  text-shadow:0 0 34px rgba(255,215,0,.7), 0 5px 18px rgba(0,0,0,.9);
}
.win-popup.show{animation:popIn .75s cubic-bezier(.34,1.56,.64,1) forwards;}
.win-popup small{
  display:block;margin-top:5px;font-family:'Inter',sans-serif;
  font-size:.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:rgba(255,255,255,.62);text-shadow:none;
}
@keyframes popIn{
  0%{opacity:0;transform:scale(.25) translateY(10px);}
  55%{opacity:1;transform:scale(1.08) translateY(0);}
  100%{opacity:1;transform:scale(1);}
}
.confetti{position:absolute;inset:0;overflow:hidden;}
.confetti i{position:absolute;top:-14px;display:block;animation:fall linear forwards;}
@keyframes fall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(560px) rotate(760deg);opacity:0;}
}

/* ── CONTROLS ── */
.controls{display:flex;align-items:center;gap:9px;}
.bet-section{
  display:flex;align-items:center;gap:3px;
  padding:4px;border-radius:15px;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,215,0,.1);
}
.bet-btn{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;cursor:pointer;
  display:grid;place-items:center;font-size:.62rem;font-weight:900;color:var(--gold);
  background:linear-gradient(180deg, rgba(255,215,0,.15), rgba(255,215,0,.03));
  border:1px solid rgba(255,215,0,.14);transition:.15s;
}
.bet-btn:hover{background:rgba(255,215,0,.22);}
.bet-btn:active{transform:scale(.9);}
.bet-label{font-size:.5rem;font-weight:800;letter-spacing:1.2px;color:rgba(255,215,0,.5);text-transform:uppercase;padding:0 2px;}
.bet-display{min-width:34px;text-align:center;font-size:1rem;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;}
.max-btn{
  padding:5px 11px;border-radius:10px;cursor:pointer;
  font-size:.56rem;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);
  background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.18);transition:.18s;
}
.max-btn:hover{background:rgba(255,215,0,.22);}
.max-btn:active{transform:scale(.94);}
.spin-btn{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 12px;border:0;border-radius:15px;cursor:pointer;
  font-size:.92rem;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;
  color:#3a2500;
  background:linear-gradient(180deg,#fff0a8 0%,#ffd700 38%,#e2a000 100%);
  box-shadow:
    0 7px 22px rgba(255,180,0,.28),
    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -2px 0 rgba(120,70,0,.35);
  transition:transform .12s, box-shadow .2s, filter .2s;
}
.spin-btn:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 10px 30px rgba(255,180,0,.4),inset 0 1px 0 rgba(255,255,255,.7);}
.spin-btn:active:not(:disabled){transform:translateY(1px) scale(.985);}
.spin-btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none;filter:grayscale(.35);}
.spin-btn .ic{font-size:1.1rem;line-height:1;}

/* ── MESSAGE ── */
.message{
  min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 14px;border-radius:13px;text-align:center;
  font-size:.78rem;font-weight:600;line-height:1.3;
  color:rgba(255,255,255,.68);
  background:rgba(0,0,0,.38);
  border:1px solid rgba(255,215,0,.06);transition:.25s;
}
.message.win{color:var(--green);background:rgba(78,255,138,.07);border-color:rgba(78,255,138,.18);}
.message.lose{color:var(--red);background:rgba(255,71,87,.07);border-color:rgba(255,71,87,.18);}
.message.half{color:var(--orange);background:rgba(255,165,2,.07);border-color:rgba(255,165,2,.18);}
.message.jackpot{
  color:#ffd700;background:rgba(255,215,0,.09);border-color:rgba(255,215,0,.28);
  animation:pulseGold .75s ease-in-out infinite alternate;
}
@keyframes pulseGold{
  from{text-shadow:0 0 8px rgba(255,215,0,.2);}
  to{text-shadow:0 0 24px rgba(255,215,0,.65);}
}

/* ── BOTTOM PANEL ── */
.bottom-panel{display:flex;gap:10px;flex-wrap:wrap;}
.history-box{
  flex:1 1 180px;min-width:0;display:flex;flex-direction:column;
  padding:9px 11px;border-radius:15px;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,215,0,.06);
  max-height:118px;
}
.history-header{
  display:flex;align-items:center;justify-content:space-between;
  font-size:.55rem;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:rgba(255,215,0,.42);margin-bottom:5px;
}
.clear-btn{
  border:0;background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);
  cursor:pointer;font-size:.68rem;line-height:1;padding:3px 8px;border-radius:9px;transition:.2s;
}
.clear-btn:hover{color:var(--red);background:rgba(255,71,87,.1);}
.history-list{
  list-style:none;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:3px;
  font-size:.68rem;font-weight:600;padding-right:3px;scrollbar-width:thin;
}
.history-list::-webkit-scrollbar{width:3px;}
.history-list::-webkit-scrollbar-thumb{background:rgba(255,215,0,.22);border-radius:9px;}
.history-list li{
  display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:7px;
  background:rgba(255,255,255,.025);white-space:nowrap;
}
.history-list li.empty{justify-content:center;background:transparent;font-style:italic;color:rgba(255,255,255,.16);}
.h-label{color:rgba(255,255,255,.55);}
.h-net{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;}
.h-net.up{color:var(--green);}
.h-net.down{color:var(--red);}
.h-net.even{color:var(--orange);}

.db-buttons{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap;}
.btn{
  padding:8px 15px;border-radius:12px;cursor:pointer;
  font-size:.66rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  white-space:nowrap;transition:.2s;border:1px solid transparent;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;
}
.btn-topup{color:var(--green);background:rgba(78,255,138,.09);border-color:rgba(78,255,138,.22);}
.btn-topup:hover{background:rgba(78,255,138,.18);}
.btn-slot{color:#fff;background:linear-gradient(145deg,#e74c3c,#c0392b);border-color:rgba(255,255,255,.1);}
.btn-slot:hover{background:linear-gradient(145deg,#ff6b6b,#e74c3c);}
.btn:active{transform:scale(.95);}

/* ── RESPONSIVE ── */
@media (max-width:460px){
  .cabinet{padding:11px;gap:10px;border-radius:22px;}
  .brand-title{font-size:.92rem;}
  .brand-sub{letter-spacing:1.6px;}
  .stat{min-width:66px;padding:4px 7px;}
  .stat .value{font-size:.85rem;}
  .spin-btn{font-size:.82rem;padding:12px 10px;letter-spacing:1px;}
  .message{font-size:.72rem;min-height:36px;}
  .history-box{max-height:96px;}
  .corner-gem{width:10px;height:10px;}
}
@media (max-width:370px){
  .brand-sub{display:none;}
  .stat{min-width:58px;}
  .stat .label{font-size:.42rem;}
  .stat .value{font-size:.76rem;}
  .bet-label{display:none;}
  .bet-btn{width:27px;height:27px;flex-basis:27px;}
  .max-btn{padding:4px 8px;font-size:.5rem;}
  .spin-btn{font-size:.74rem;letter-spacing:.6px;padding:11px 8px;}
}
@media (min-width:760px){.cabinet{max-width:560px;padding:18px;}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}
</style>
</head>
<body>

<div class="cabinet">
  <span class="corner-gem tl"></span>
  <span class="corner-gem tr"></span>
  <span class="corner-gem bl"></span>
  <span class="corner-gem br"></span>

  <header class="cabinet-top">
    <div class="brand">
      <span class="brand-crown">♛</span>
      <div>
        <span class="brand-title">Wheel of Fortune</span>
        <span class="brand-sub">ArvRoyal Spin</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="label">Balance</span>
        <span class="value" id="balanceDisplay"><span class="cur">$</span>1,000</span>
      </div>
      <div class="stat">
        <span class="label">Win</span>
        <span class="value win" id="winDisplay"><span class="cur">$</span>0</span>
      </div>
      <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
    </div>
  </header>

  <div class="stage">
    <div class="wheel-stage" id="wheelStage">
      <div class="pointer" id="pointer"></div>
      <canvas id="wheelCanvas" width="600" height="600"></canvas>
      <div class="fx">
        <div class="win-popup" id="winPopup">
          <span id="popupText">🎉 +$0</span>
          <small id="popupSub">multiplier</small>
        </div>
        <div class="confetti" id="confetti"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="bet-section">
      <button class="bet-btn" id="betDown" aria-label="Decrease bet">◀</button>
      <span class="bet-label">Bet</span>
      <span class="bet-display" id="betDisplay">10</span>
      <button class="bet-btn" id="betUp" aria-label="Increase bet">▶</button>
      <button class="max-btn" id="maxBetBtn">Max</button>
    </div>
    <button class="spin-btn" id="spinBtn">
      <span class="ic">🎡</span> Spin
    </button>
  </div>

  <div class="message" id="messageDisplay">✨ Place your bet and spin!</div>

  <div class="bottom-panel">
    <div class="history-box">
      <div class="history-header">
        <span>📜 History</span>
        <button class="clear-btn" id="clearHistoryBtn" aria-label="Clear history">✕</button>
      </div>
      <ul class="history-list" id="historyList">
        <li class="empty">No spins yet</li>
      </ul>
    </div>
    <div class="db-buttons">
      <a href="index.html" class="btn btn-slot">🎰 Slot Machine</a>
      <button class="btn btn-topup" id="topUpBtn">➕ Top Up</button>
    </div>
  </div>
</div>

<audio id="bgMusic" loop preload="none">
  <source src="bgmusicslotmachine.mp3" type="audio/mpeg" />
</audio>
<audio id="spinningSound" loop preload="none">
  <source src="Spinning-slotmachine.mp3" type="audio/mpeg" />
</audio>
<audio id="jackpotSound" preload="none">
  <source src="Slot-Machine-Jackpot-Sound-Effect.mp3" type="audio/mpeg" />
</audio>

<script>
(function(){
'use strict';

/* ═══════════ SHARED BALANCE (shared with index.html) ═══════════ */
const SHARED_KEY = 'arvroyal_shared_balance';
function readSharedBalance(){
  const raw = localStorage.getItem(SHARED_KEY);
  if (raw === null) { localStorage.setItem(SHARED_KEY, '1000'); return 1000; }
  const n = parseFloat(raw);
  return isFinite(n) ? Math.max(0, n) : 1000;
}
function writeSharedBalance(v){
  const n = Math.max(0, Math.floor(v));
  localStorage.setItem(SHARED_KEY, String(n));
  return n;
}
/* ═════════════════════════════════════════════════════════════════ */

const TAU = Math.PI * 2;

/* 12 segments — classic casino look, RTP ≈ 95.8% */
const SEGMENTS = [
  { label:'2x',   value:2,      color:'#8b1a1a', text:'#fff3d0' },
  { label:'LOSE', value:'lose', color:'#131318', text:'#c9c9d2' },
  { label:'3x',   value:3,      color:'#131318', text:'#ffe98a' },
  { label:'LOSE', value:'lose', color:'#8b1a1a', text:'#f5e0b0' },
  { label:'2x',   value:2,      color:'#131318', text:'#fff3d0' },
  { label:'LOSE', value:'lose', color:'#8b1a1a', text:'#f5e0b0' },
  { label:'5x',   value:5,      color:'#0d3b66', text:'#d6f0ff' },
  { label:'LOSE', value:'lose', color:'#8b1a1a', text:'#f5e0b0' },
  { label:'2x',   value:2,      color:'#131318', text:'#fff3d0' },
  { label:'LOSE', value:'lose', color:'#8b1a1a', text:'#f5e0b0' },
  { label:'HALF', value:'half', color:'#0d3b66', text:'#c8ecff' },
  { label:'LOSE', value:'lose', color:'#131318', text:'#c9c9d2' }
];
const N = SEGMENTS.length;
const SEG_ANGLE = TAU / N;

/* ── state ── */
let balance = readSharedBalance();
let bet = 10;
let currentWin = 0;
let history = [];
let isSpinning = false;
let muted = false;
let rotation = 0;

/* ── DOM ── */
const $ = id => document.getElementById(id);
const balanceDisplay = $('balanceDisplay');
const winDisplay     = $('winDisplay');
const betDisplay     = $('betDisplay');
const messageDisplay = $('messageDisplay');
const historyList    = $('historyList');
const spinBtn        = $('spinBtn');
const betUp          = $('betUp');
const betDown        = $('betDown');
const maxBetBtn      = $('maxBetBtn');
const muteBtn        = $('muteBtn');
const topUpBtn       = $('topUpBtn');
const clearHistoryBtn= $('clearHistoryBtn');
const winPopup       = $('winPopup');
const popupText      = $('popupText');
const popupSub       = $('popupSub');
const confettiEl     = $('confetti');
const pointerEl      = $('pointer');
const wheelStage     = $('wheelStage');
const canvas         = $('wheelCanvas');
const ctx            = canvas.getContext('2d');

const bgMusic       = $('bgMusic');
const spinningSound = $('spinningSound');
const jackpotSound  = $('jackpotSound');

/* ── helpers ── */
const money = n => '$' + Math.floor(n).toLocaleString('en-US');
function setMessage(t, type){ messageDisplay.textContent = t; messageDisplay.className = 'message' + (type && type!=='info' ? ' '+type : ''); }
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if (amt>0){ r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  else { r*=1+amt; g*=1+amt; b*=1+amt; }
  return `rgb(${r|0},${g|0},${b|0})`;
}

/* ── UI ── */
function updateUI(){
  balanceDisplay.innerHTML = `<span class="cur">$</span>${Math.floor(balance).toLocaleString('en-US')}`;
  winDisplay.innerHTML     = `<span class="cur">$</span>${Math.floor(currentWin).toLocaleString('en-US')}`;
  betDisplay.textContent   = bet;
  if (bet > balance){ bet = Math.max(1, Math.floor(balance)); betDisplay.textContent = bet; }
  if (balance <= 0 && !isSpinning){
    spinBtn.disabled = true;
    setMessage('💔 Out of funds — tap Top Up to continue.', 'lose');
  } else {
    spinBtn.disabled = isSpinning || balance < 1;
  }
  renderHistory();
}
function renderHistory(){
  if (!history.length){ historyList.innerHTML = '<li class="empty">No spins yet</li>'; return; }
  let html = '';
  for (const h of history.slice(0, 22)){
    const cls = h.net>0 ? 'up' : (h.net<0 ? 'down' : 'even');
    const sign = h.net>0 ? '+' : (h.net<0 ? '-' : '±');
    html += `<li><span class="h-label">${h.label}</span><span class="h-net ${cls}">${sign}${money(Math.abs(h.net)).slice(1)}</span></li>`;
  }
  historyList.innerHTML = html;
}
function pushHistory(label, b, w){
  history.unshift({ label, bet:b, win:w, net:w-b });
  if (history.length > 40) history.pop();
}

/* ── audio (synth) ── */
let actx = null;
function audioCtx(){
  if (!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume().catch(()=>{});
  return actx;
}
function beep(freq, dur, type, vol, sweepTo){
  if (muted) return;
  const a = audioCtx(); if (!a) return;
  try {
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(sweepTo, t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  } catch(_){}
}
const tickSound = () => beep(1400 + Math.random()*380, 0.045, 'square', 0.055, 420);
function winChime(){ [523,659,784,1047].forEach((f,i)=> setTimeout(()=>beep(f,0.22,'triangle',0.09), i*85)); }
function jackpotChime(){ [523,659,784,1047,1319,1568].forEach((f,i)=> setTimeout(()=>beep(f,0.3,'triangle',0.11), i*90)); }

/* ── canvas ── */
let sprite = null, wheelSize = 400, dpr = 1;

function setupCanvas(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const S = Math.max(1, Math.round(wheelSize));
  canvas.width  = Math.round(S*dpr);
  canvas.height = Math.round(S*dpr);
  canvas.style.width  = S + 'px';
  canvas.style.height = S + 'px';
  buildSprite();
  drawWheel(rotation);
}

/* Pre-render the rotating face once */
function buildSprite(){
  const S = wheelSize;
  if (!sprite) sprite = document.createElement('canvas');
  sprite.width  = Math.round(S*dpr);
  sprite.height = Math.round(S*dpr);

  const c = sprite.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,S,S);

  const cx = S/2, cy = S/2;
  const R = S/2 - 2;
  const rimW = Math.max(9, R*0.115);
  const faceR = R - rimW;

  /* outer metallic rim */
  const rimGrad = c.createLinearGradient(0,0,S,S);
  rimGrad.addColorStop(0.00, '#5b3d0c');
  rimGrad.addColorStop(0.18, '#eac95f');
  rimGrad.addColorStop(0.38, '#8a6516');
  rimGrad.addColorStop(0.56, '#f8e79a');
  rimGrad.addColorStop(0.76, '#7a5810');
  rimGrad.addColorStop(1.00, '#d8ab3a');
  c.beginPath(); c.arc(cx,cy,R,0,TAU); c.fillStyle = rimGrad; c.fill();

  /* rim bevel */
  c.beginPath(); c.arc(cx,cy,R,0,TAU); c.arc(cx,cy,faceR,0,TAU,true);
  const bevel = c.createRadialGradient(cx,cy,faceR,cx,cy,R);
  bevel.addColorStop(0, 'rgba(0,0,0,.6)');
  bevel.addColorStop(.45, 'rgba(0,0,0,.05)');
  bevel.addColorStop(.8, 'rgba(255,240,180,.28)');
  bevel.addColorStop(1, 'rgba(0,0,0,.35)');
  c.fillStyle = bevel; c.fill();

  /* face base */
  c.beginPath(); c.arc(cx,cy,faceR,0,TAU); c.fillStyle = '#0b0806'; c.fill();

  /* segments */
  for (let i = 0; i < N; i++){
    const seg = SEGMENTS[i];
    const a0 = i*SEG_ANGLE, a1 = a0 + SEG_ANGLE;
    c.beginPath();
    c.moveTo(cx,cy);
    c.arc(cx,cy,faceR,a0,a1);
    c.closePath();
    const g = c.createRadialGradient(cx,cy,faceR*0.08,cx,cy,faceR);
    g.addColorStop(0.00, shade(seg.color, -0.5));
    g.addColorStop(0.55, seg.color);
    g.addColorStop(1.00, shade(seg.color, 0.2));
    c.fillStyle = g; c.fill();
  }

  /* dividers */
  c.lineCap = 'round';
  for (let i = 0; i < N; i++){
    const a = i*SEG_ANGLE;
    const x1 = cx + Math.cos(a)*faceR*0.055;
    const y1 = cy + Math.sin(a)*faceR*0.055;
    const x2 = cx + Math.cos(a)*faceR;
    const y2 = cy + Math.sin(a)*faceR;
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2);
    c.strokeStyle = 'rgba(0,0,0,.55)';
    c.lineWidth = Math.max(1.4, faceR*0.014); c.stroke();
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2);
    c.strokeStyle = 'rgba(255,215,0,.22)';
    c.lineWidth = Math.max(0.6, faceR*0.005); c.stroke();
  }

  /* labels */
  for (let i = 0; i < N; i++){
    const seg = SEGMENTS[i];
    const mid = (i + 0.5)*SEG_ANGLE;
    c.save();
    c.translate(cx,cy);
    c.rotate(mid);
    c.textAlign = 'right';
    c.textBaseline = 'middle';
    const fs = faceR * (seg.label.length > 3 ? 0.115 : 0.145);
    c.font = `900 ${fs}px 'Inter', sans-serif`;
    c.lineJoin = 'round';
    c.strokeStyle = 'rgba(0,0,0,.4)';
    c.lineWidth = fs*0.22;
    c.strokeText(seg.label, faceR*0.9, 0);
    c.fillStyle = seg.text;
    c.fillText(seg.label, faceR*0.9, 0);
    c.restore();
  }

  /* pegs */
  const pegRing = faceR + rimW*0.42;
  const pegSize = Math.max(2.4, R*0.028);
  for (let i = 0; i < N; i++){
    const a = i*SEG_ANGLE;
    const px = cx + Math.cos(a)*pegRing;
    const py = cy + Math.sin(a)*pegRing;
    c.beginPath();
    c.arc(px, py + pegSize*0.35, pegSize, 0, TAU);
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fill();
    const pg = c.createRadialGradient(px-pegSize*0.35, py-pegSize*0.35, pegSize*0.08, px, py, pegSize);
    pg.addColorStop(0, '#fffbe6');
    pg.addColorStop(0.45, '#ffd95e');
    pg.addColorStop(1, '#8a6512');
    c.beginPath(); c.arc(px,py,pegSize,0,TAU);
    c.fillStyle = pg; c.fill();
  }

  /* outer hairline */
  c.beginPath(); c.arc(cx,cy,R-1,0,TAU);
  c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = 2; c.stroke();
}

/* Draw the wheel with current rotation + static lighting */
function drawWheel(rot){
  const S = wheelSize;
  const cx = S/2, cy = S/2;
  const R = S/2 - 2;
  const rimW = Math.max(9, R*0.115);
  const faceR = R - rimW;

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,S,S);

  /* rotating face */
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rot);
  ctx.drawImage(sprite, -S/2, -S/2, S, S);
  ctx.restore();

  /* static lighting */
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU); ctx.clip();
  const lg = ctx.createLinearGradient(0,0,0,S);
  lg.addColorStop(0.00, 'rgba(255,255,255,.17)');
  lg.addColorStop(0.16, 'rgba(255,255,255,.05)');
  lg.addColorStop(0.48, 'rgba(255,255,255,0)');
  lg.addColorStop(0.82, 'rgba(0,0,0,.13)');
  lg.addColorStop(1.00, 'rgba(0,0,0,.34)');
  ctx.fillStyle = lg;
  ctx.fillRect(0,0,S,S);

  const hx = cx - R*0.34, hy = cy - R*0.48;
  const hg = ctx.createRadialGradient(hx,hy,0,hx,hy,R*0.62);
  hg.addColorStop(0, 'rgba(255,255,255,.15)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.ellipse(hx,hy,R*0.62,R*0.36,-0.5,0,TAU);
  ctx.fill();
  ctx.restore();

  /* static centre hub */
  const hubR = faceR * 0.20;
  const hgr = ctx.createRadialGradient(cx-hubR*0.45, cy-hubR*0.5, hubR*0.1, cx, cy, hubR*1.35);
  hgr.addColorStop(0, '#fff6cc');
  hgr.addColorStop(0.36, '#e9c552');
  hgr.addColorStop(0.72, '#a1761a');
  hgr.addColorStop(1, '#5d3f08');
  ctx.beginPath(); ctx.arc(cx,cy,hubR*1.35,0,TAU); ctx.fillStyle = hgr; ctx.fill();

  ctx.beginPath(); ctx.arc(cx,cy,hubR*1.06,0,TAU);
  const ig = ctx.createRadialGradient(cx, cy-hubR*0.3, 0, cx, cy, hubR*1.1);
  ig.addColorStop(0, '#31200f');
  ig.addColorStop(1, '#0a0503');
  ctx.fillStyle = ig; ctx.fill();

  ctx.fillStyle = '#ffd700';
  ctx.font = `900 ${hubR*0.95}px 'Playfair Display', serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('♛', cx, cy + hubR*0.06);

  /* static top-light ring */
  ctx.beginPath(); ctx.arc(cx,cy,R,0,TAU);
  ctx.strokeStyle = 'rgba(255,235,170,.16)';
  ctx.lineWidth = 1.5; ctx.stroke();
}

/* which segment under pointer? */
function pointerIndex(rot){
  const eff = ((-Math.PI/2 - rot) % TAU + TAU) % TAU;
  return Math.floor(eff / SEG_ANGLE) % N;
}

/* ── FX ── */
function showPopup(text, sub){
  popupText.textContent = text;
  popupSub.textContent = sub;
  winPopup.classList.remove('show');
  void winPopup.offsetWidth;
  winPopup.classList.add('show');
  setTimeout(()=> winPopup.classList.remove('show'), 1900);
}
function spawnConfetti(count){
  const colors = ['#ffd700','#ff6b6b','#4ecdc4','#45b7d1','#a29bfe','#ff8a5c','#fd79a8','#fdcb6e','#00d2d3','#ff4757'];
  const frag = document.createDocumentFragment();
  const W = confettiEl.clientWidth || 400;
  for (let i = 0; i < count; i++){
    const el = document.createElement('i');
    const size = 4 + Math.random()*8;
    el.style.width = size + 'px';
    el.style.height = (size*(0.45+Math.random())).toFixed(1) + 'px';
    el.style.background = colors[(Math.random()*colors.length)|0];
    el.style.left = (Math.random()*W) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.animationDuration = (1.4 + Math.random()*1.8).toFixed(2) + 's';
    el.style.animationDelay = (Math.random()*0.5).toFixed(2) + 's';
    frag.appendChild(el);
  }
  confettiEl.appendChild(frag);
  setTimeout(()=>{ confettiEl.innerHTML = ''; }, 3800);
}

/* ── SPIN ── */
function spinWheel(){
  if (isSpinning) return;
  if (bet > balance){ setMessage('❌ Insufficient balance!', 'lose'); return; }

  isSpinning = true;
  spinBtn.disabled = true;
  balance -= bet;
  balance = writeSharedBalance(balance);
  currentWin = 0;
  updateUI();
  setMessage('🎡 Spinning…', 'info');
  winPopup.classList.remove('show');
  confettiEl.innerHTML = '';

  if (!muted){ try { spinningSound.currentTime = 0; spinningSound.play().catch(()=>{}); } catch(_){} }

  /* fair random target */
  const targetIdx = (Math.random()*N)|0;
  const jitter = (Math.random() - 0.5)*0.62;
  const targetEff = (targetIdx + 0.5 + jitter)*SEG_ANGLE;
  const base = -Math.PI/2 - targetEff;
  const turns = 6 + Math.random()*3;
  const k = Math.ceil((rotation + turns*TAU - base)/TAU);
  const finalRotation = base + k*TAU;

  const startRotation = rotation;
  const delta = finalRotation - startRotation;
  const duration = 5000 + Math.random()*900;
  const t0 = performance.now();

  let lastIdx = pointerIndex(startRotation);
  let prevRot = startRotation;

  const easeOut = t => 1 - Math.pow(1-t, 4.2);

  function frame(now){
    const p = Math.min((now - t0)/duration, 1);
    const rot = startRotation + delta*easeOut(p);

    const speed = Math.abs(rot - prevRot);
    const flex = Math.min(13, speed*42);
    pointerEl.style.transform = `translateX(-50%) rotate(${-flex}deg)`;
    prevRot = rot;

    const idx = pointerIndex(rot);
    if (idx !== lastIdx){ lastIdx = idx; tickSound(); }

    rotation = rot;
    drawWheel(rot);

    if (p < 1) requestAnimationFrame(frame);
    else {
      rotation = finalRotation;
      drawWheel(finalRotation);
      pointerEl.style.transform = 'translateX(-50%) rotate(0deg)';
      finishSpin();
    }
  }
  requestAnimationFrame(frame);
}

function finishSpin(){
  try { spinningSound.pause(); spinningSound.currentTime = 0; } catch(_){}

  const seg = SEGMENTS[pointerIndex(rotation)];
  let win = 0, type = 'info', text = '';

  if (seg.value === 'lose'){
    type = 'lose'; text = `💀 LOSE — you lost ${money(bet)}`;
  } else if (seg.value === 'half'){
    win = Math.floor(bet*0.5); type = 'half';
    text = `✂️ HALF — ${money(win)} returned (lost ${money(bet - win)})`;
  } else {
    win = bet*seg.value; type = 'win';
    text = `🎯 ${seg.label} — you won ${money(win)}!`;
    if (seg.value >= 5){
      type = 'jackpot';
      text = `🏆 JACKPOT! ${seg.label} = ${money(win)}`;
      if (!muted){ try { jackpotSound.currentTime = 0; jackpotSound.play().catch(()=>{}); } catch(_){} }
      jackpotChime();
      spawnConfetti(56);
      showPopup(`🎉 +${money(win)}`, `${seg.label} multiplier`);
    } else {
      winChime();
      spawnConfetti(14);
      showPopup(`+${money(win)}`, `${seg.label} multiplier`);
    }
  }

  setMessage(text, type);
  balance += win;
  balance = writeSharedBalance(balance);
  currentWin = win;
  pushHistory(seg.label, bet, win);

  isSpinning = false;
  updateUI();
  autoplayMusic();
}

/* ── music ── */
function autoplayMusic(){
  if (muted) return;
  if (bgMusic.paused){
    bgMusic.volume = 0.35;
    bgMusic.play().catch(()=>{});
  }
}

/* ── bet controls ── */
const UP = [1,2,5,10,20,50,100,250,500,1000];
const DN = [...UP].reverse();
betUp.addEventListener('click', ()=>{
  if (isSpinning) return;
  let next = bet;
  for (const s of UP){ if (bet < s){ next = s; break; } }
  if (next <= bet) next = bet + 1;
  bet = Math.min(next, Math.max(1, Math.floor(balance)));
  updateUI();
});
betDown.addEventListener('click', ()=>{
  if (isSpinning) return;
  let next = 1;
  for (const s of DN){ if (bet > s){ next = s; break; } }
  bet = Math.max(1, next);
  updateUI();
});
maxBetBtn.addEventListener('click', ()=>{
  if (isSpinning) return;
  bet = Math.max(1, Math.floor(balance));
  updateUI();
});

/* ── spin / mute / topup ── */
spinBtn.addEventListener('click', ()=>{ audioCtx(); spinWheel(); });
canvas.addEventListener('click', ()=>{ audioCtx(); if (!isSpinning) spinWheel(); });

muteBtn.addEventListener('click', ()=>{
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if (muted) [bgMusic, spinningSound, jackpotSound].forEach(a=>{ try{ a.pause(); }catch(_){} });
  else autoplayMusic();
});

topUpBtn.addEventListener('click', ()=>{
  balance += 500;
  balance = writeSharedBalance(balance);
  setMessage('💰 Topped up +$500', 'win');
  beep(880,0.15,'triangle',0.08);
  updateUI();
  autoplayMusic();
});

clearHistoryBtn.addEventListener('click', ()=>{
  if (isSpinning) return;
  history = [];
  updateUI();
  setMessage('🧹 History cleared', 'info');
});

/* ── keyboard ── */
document.addEventListener('keydown', e=>{
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  if (e.code === 'Space' || e.key === 'Enter'){ e.preventDefault(); spinBtn.click(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); betUp.click(); }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); betDown.click(); }
  else if (e.key === 'm' || e.key === 'M') muteBtn.click();
});

/* ── resize ── */
let resizeRAF = null;
function handleResize(){
  cancelAnimationFrame(resizeRAF);
  resizeRAF = requestAnimationFrame(()=>{
    const w = wheelStage.clientWidth;
    if (w && Math.abs(w - wheelSize) > 0.5){
      wheelSize = w;
      setupCanvas();
    }
  });
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', ()=> setTimeout(handleResize, 220));
if (window.ResizeObserver) new ResizeObserver(handleResize).observe(wheelStage);

/* ── sync shared balance across tabs ── */
window.addEventListener('storage', e=>{
  if (e.key !== SHARED_KEY || e.newValue === null) return;
  const n = parseFloat(e.newValue);
  if (isFinite(n) && !isSpinning){
    balance = Math.max(0, n);
    updateUI();
  }
});
/* refocus → re-read (in case other tab changed it while we were hidden) */
window.addEventListener('focus', ()=>{
  if (isSpinning) return;
  const n = readSharedBalance();
  if (n !== balance){ balance = n; updateUI(); }
});
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState === 'visible' && !isSpinning){
    const n = readSharedBalance();
    if (n !== balance){ balance = n; updateUI(); }
  }
});

/* ── init ── */
function init(){
  balance = readSharedBalance();
  wheelSize = wheelStage.clientWidth || 400;
  setupCanvas();
  if (bet > balance) bet = Math.max(1, Math.floor(balance));
  updateUI();
  setMessage('✨ Place your bet and spin!', 'info');

  [spinningSound, jackpotSound, bgMusic].forEach(a=>{ try{ a.volume = 0.35; }catch(_){} });

  const unlock = ()=>{
    audioCtx();
    autoplayMusic();
    document.removeEventListener('pointerdown', unlock);
    document.removeEventListener('keydown', unlock);
  };
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('keydown', unlock);

  /* re-sync balance occasionally so slot changes show up */
  setInterval(()=>{
    if (isSpinning) return;
    const n = readSharedBalance();
    if (n !== balance){ balance = n; updateUI(); }
  }, 2000);
}
init();
})();
</script>
